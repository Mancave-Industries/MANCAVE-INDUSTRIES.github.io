<style>
/* Layout: one screen, one job. The shop's shed wall, a stencilled headline, three big buttons. */
:root{color-scheme:dark;--wall:#11100f;--wall-2:#1a1816;--paper:#ede4d3;--red:#d9262c;--uv:#ff2e88;--chalk:#f3eee6;--smoke:#a8a097;
--stencil:"Big Shoulders Stencil Display","Arial Black",Impact,sans-serif;--label:"Barlow Condensed","Arial Narrow",sans-serif;--text:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;min-height:100vh;color:var(--chalk);font:400 1.05rem/1.55 var(--text);background-color:var(--wall);
background-image:radial-gradient(60vmax 40vmax at 85% 8%,rgba(255,46,136,.14),transparent 60%),radial-gradient(50vmax 40vmax at 5% 70%,rgba(217,38,44,.12),transparent 60%);
padding:calc(28px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(36px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
main{max-width:620px;margin:0 auto;display:grid;gap:clamp(22px,5vw,34px);justify-items:center;text-align:center}
.seal{width:96px;height:96px}
.seal img{width:100%;height:100%}
h1{font:900 clamp(3.4rem,15vw,6.4rem)/.86 var(--stencil);text-transform:uppercase;margin:0;letter-spacing:.01em}
h1 span{color:var(--uv)}
.by{margin:0;max-width:40ch;color:var(--smoke);font-size:1.12rem;text-wrap:balance}
.links{display:grid;gap:16px;width:100%}
.links a{display:flex;align-items:center;gap:18px;padding:18px 22px;text-decoration:none;color:#fff;background:var(--red);box-shadow:6px 6px 0 var(--uv);transition:transform .15s ease,box-shadow .15s ease;text-align:left}
.links a:nth-child(2){background:var(--chalk);color:var(--wall);box-shadow:6px 6px 0 var(--red)}
.links a:nth-child(3){background:var(--uv);color:var(--wall);box-shadow:6px 6px 0 var(--chalk)}
.links a:nth-child(4){background:var(--wall-2);color:var(--chalk);outline:2px solid var(--chalk);outline-offset:-2px;box-shadow:6px 6px 0 var(--red)}
.links a:hover{transform:translate(-2px,-2px)}
.links a:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--uv)}
.links a:focus-visible{outline:3px solid var(--chalk);outline-offset:4px}
.links svg{width:44px;height:44px;flex:none}
.links b{display:block;font:900 clamp(2rem,8vw,2.7rem)/.9 var(--stencil);text-transform:uppercase}
.links small{display:block;font:700 .85rem/1.2 var(--label);letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-top:4px}
.back{font:700 .85rem/1 var(--label);letter-spacing:.18em;text-transform:uppercase;color:var(--smoke)}
.back:hover{color:var(--uv)}
@media (prefers-reduced-motion:reduce){.links a{transition:none}}
</style>
</head>
